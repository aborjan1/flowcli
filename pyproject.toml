[project]
name = "flowcli"
version = "0.2.0"
description = "Static call-graph mapper for Python codebases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = []

[project.scripts]
flowcli = "flowcli.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4.4,<9.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0,<2.0.0",
    "ruff>=0.10.0",
]

[tool.uv]
managed = true
default-groups = "all"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I001", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
files = ["src/flowcli", "tests"]
mypy_path = "src"
exclude = "tests/fixtures"
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Fixture projects under tests/fixtures are sample code for the parser to chew on,
# deliberately outside the type-checked surface. Tests import them at runtime via sys.path.
[[tool.mypy.overrides]]
module = ["traceproj", "traceproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "build", "dist"]
